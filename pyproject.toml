[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salesforce-crm-ai-lab"
version = "0.1.0"
description = "Synthetic-data Salesforce CRM and AI integration lab"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]